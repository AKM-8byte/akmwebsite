<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AKM · Kişisel arşiv</title>
  <meta name="i18n-title" content="home.title">
  <meta name="description" content="İzlediğim filmler, oynadığım oyunlar ve yaptığım projeler — hepsi tek bir yerde.">
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero">
      <div class="wall" aria-hidden="true"><div class="wall__plane" id="wall"></div></div>
      <div class="wrap hero__inner">
        <h1 class="display hero__title" aria-label="AKM"><span>A</span><span>K</span><span>M</span><sup>/ <span data-i18n="nav.archive">arşiv</span></sup></h1>
        <div class="hero__row">
          <p class="hero__intro" id="intro"></p>
          <div class="now" id="now"></div>
        </div>
      </div>
      <span class="scroll-cue" aria-hidden="true" data-i18n="home.scroll">KAYDIR</span>
    </section>

    <div class="ticker" aria-hidden="true"><div class="ticker__track" id="ticker"></div></div>

    <div class="wrap">
      <nav class="doors" aria-label="Sections">
        <a class="door reveal" href="filmler/">
          <span class="door__num">01</span>
          <div>
            <h2 class="door__title" data-i18n="nav.films">Filmler</h2>
            <p class="door__desc" data-i18n="home.films.desc"></p>
          </div>
          <span class="door__count"><b id="c-films">—</b><span data-i18n="home.count.films"></span></span>
          <div class="door__fan" id="fan-films"></div>
        </a>
        <a class="door reveal" href="oyunlar/">
          <span class="door__num">02</span>
          <div>
            <h2 class="door__title" data-i18n="nav.games">Oyunlar</h2>
            <p class="door__desc" data-i18n="home.games.desc"></p>
          </div>
          <span class="door__count"><b id="c-games">—</b><span data-i18n="home.count.games"></span></span>
          <div class="door__fan" id="fan-games"></div>
        </a>
        <a class="door reveal" href="projeler/">
          <span class="door__num">03</span>
          <div>
            <h2 class="door__title" data-i18n="nav.projects">Projeler</h2>
            <p class="door__desc" data-i18n="home.projects.desc"></p>
          </div>
          <span class="door__count"><b id="c-projects">—</b><span data-i18n="home.count.projects"></span></span>
          <div class="door__fan door__fan--wide" id="fan-projects"></div>
        </a>
      </nav>

      <section class="about reveal" id="hakkimda">
        <div>
          <span class="eyebrow" data-i18n="home.about">Hakkımda</span>
          <h2 class="display"><span data-i18n="home.hello">Merhaba</span><em>.</em></h2>
        </div>
        <div>
          <p class="about__text" id="about"></p>
          <div class="about__links" id="links"></div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
